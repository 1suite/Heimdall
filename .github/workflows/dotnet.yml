name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Configure Gitea credentials for submodules
      env:
        TOKEN: ${{ secrets.GITEA_SUBMODULE_TOKEN }}
      run: |
        git config --global url."https://${{ secrets.GITEA_SUBMODULE_TOKEN }}@forge.obfuscator.fr/".insteadOf "https://forge.obfuscator.fr/"
        echo ${#TOKEN}

    - name: Checkout with submodules
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Check formatting and style
      run: dotnet format --verify-no-changes --severity error

    - name: Build
      run: dotnet build --no-restore